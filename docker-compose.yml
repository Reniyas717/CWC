services:
  postgres:
    image: postgres:16-alpine
    container_name: cwc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cwc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cwc_password}
      POSTGRES_DB: ${POSTGRES_DB:-cloud_without_clouds}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cwc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cwc_user} -d ${POSTGRES_DB:-cloud_without_clouds}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: cwc-redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$REDIS_PASSWORD"
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cwc_redis_data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "$REDIS_PASSWORD" ]; then
            redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
          else
            redis-cli ping | grep PONG
          fi
        '
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  cwc_postgres_data:
    name: cwc_postgres_data
  cwc_redis_data:
    name: cwc_redis_data
